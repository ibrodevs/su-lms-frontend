name: Release 1 E2E

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release1-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release1-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_PORT: "8001"
      E2E_BACKEND_DIR: ${{ github.workspace }}/su-lms-backend
      VITE_API_BASE_URL: http://localhost:8001/api/v1
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend develop
        uses: actions/checkout@v4
        with:
          repository: adilhanDevs/su-lms-backend
          ref: develop
          path: su-lms-backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: docker compose -f su-lms-backend/docker-compose.yml up -d --build

      - name: Wait for backend health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8001/api/v1/health/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Seed Release 1 data
        run: docker compose -f su-lms-backend/docker-compose.yml exec -T backend python manage.py seed_release1

      - name: Run Release 1 browser tests
        run: npm run test:e2e:release1

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release1-e2e-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Backend logs
        if: always()
        run: docker compose -f su-lms-backend/docker-compose.yml logs --no-color backend

      - name: Stop backend
        if: always()
        run: docker compose -f su-lms-backend/docker-compose.yml down -v
